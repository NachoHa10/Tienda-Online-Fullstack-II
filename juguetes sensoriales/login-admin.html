<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Acceso Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="text-center mb-4">
            <div class="bg-danger text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
              <i class="bi bi-shield-lock-fill fs-4"></i>
            </div>
            <h4 class="fw-bold mb-1">Panel de Control</h4>
            <p class="text-muted small">Ingrese sus credenciales de administrador</p>
          </div>

          <!-- Alerta informativa con las credenciales simples de prueba -->
          <div class="alert alert-info py-2 px-3 small mb-3">
            <i class="bi bi-info-circle me-1"></i> <strong>Credenciales de prueba:</strong><br>
            <strong>Usuario:</strong> admin@sensoritoys.cl<br>
            <strong>Clave:</strong> admin123
          </div>

          <form action="admin.html" method="GET">
            <div class="mb-3">
              <label class="form-label fw-semibold">Usuario o Email Admin</label>
              <input type="email" class="form-control" required value="admin@sensoritoys.cl">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control" required value="admin123">
            </div>
            <button type="submit" class="btn btn-danger w-100 mb-3">Ingresar al Panel</button>
          </form>

          <div class="text-center">
            <a href="index.html" class="text-muted small text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
