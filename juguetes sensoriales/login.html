<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Acceso Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h1 class="text-primary display-5"><i class="bi bi-balloon-heart-fill text-warning me-2"></i>SensoriToys</h1>
          </a>
          <p class="text-muted">Juguetes Sensoriales para el Desarrollo y Calma</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item">
              <button class="nav-link" id="login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Ingresar</button>
            </li>
            <li class="nav-item">
              <button class="nav-link active" id="register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Registrarse</button>
            </li>
          </ul>

          <div class="tab-content" id="pills-tabContent">
            
            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <div class="tab-pane fade" id="pills-login" role="tabpanel">
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-email" class="form-label fw-semibold">Correo Electrónico</label>
                  <input type="email" id="login-email" class="form-control" placeholder="correo@ejemplo.com" required>
                  <div id="login-email-error" class="invalid-feedback d-none"></div>
                </div>
                <div class="mb-3">
                  <label for="login-pass" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                  <div id="login-pass-error" class="invalid-feedback d-none"></div>
                </div>
                <button type="submit" class="btn btn-pastel-primary w-100 py-2 fs-6 mb-3">Iniciar Sesión</button>
              </form>
            </div>

            <!-- FORMULARIO DE REGISTRO COMPLETO -->
            <div class="tab-pane fade show active" id="pills-register" role="tabpanel">
              <form id="register-form" novalidate>
                
                <!-- 1. SEPARACIÓN DE NOMBRES Y APELLIDOS -->
                <div class="mb-3">
                  <label for="reg-firstname" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                  <input type="text" id="reg-firstname" class="form-control" placeholder="Ej: Juan" required>
                  <div id="reg-firstname-error" class="invalid-feedback d-none"></div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <label for="reg-lastname1" class="form-label fw-semibold">Primer Apellido <span class="text-danger">*</span></label>
                    <input type="text" id="reg-lastname1" class="form-control" placeholder="Ej: Pérez" required>
                    <div id="reg-lastname1-error" class="invalid-feedback d-none"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="reg-lastname2" class="form-label fw-semibold">Segundo Apellido <span class="text-muted">(Opcional)</span></label>
                    <input type="text" id="reg-lastname2" class="form-control" placeholder="Ej: González">
                  </div>
                </div>

                <!-- 2. CAMPO RUT AGREGADO -->
                <div class="mb-3">
                  <label for="reg-rut" class="form-label fw-semibold">RUT <span class="text-danger">*</span></label>
                  <input type="text" id="reg-rut" class="form-control" placeholder="Ej: 12.345.678-9" required>
                  <div id="reg-rut-error" class="invalid-feedback d-none"></div>
                </div>

                <!-- 3. CORREO ELECTRÓNICO -->
                <div class="mb-3">
                  <label for="reg-email" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                  <input type="email" id="reg-email" class="form-control" placeholder="correo@ejemplo.com" required>
                  <div id="reg-email-error" class="invalid-feedback d-none"></div>
                </div>

                <!-- 4. CONTRASEÑA Y REINGRESO -->
                <div class="row mb-3">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <label for="reg-pass" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="reg-pass" class="form-control" placeholder="••••••••" required>
                    <div id="reg-pass-error" class="invalid-feedback d-none"></div>
                  </div>
                  <div class="col-md-6">
                    <label for="reg-pass-confirm" class="form-label fw-semibold">Reingresar Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="reg-pass-confirm" class="form-control" placeholder="••••••••" required>
                    <div id="reg-pass-confirm-error" class="invalid-feedback d-none"></div>
                  </div>
                </div>

                <!-- 5. CHECKBOX DE TÉRMINOS Y CONDICIONES -->
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="terms-checkbox">
                  <label class="form-check-label small" for="terms-checkbox">
                    Estoy de acuerdo con los <a href="#" class="text-primary">términos y condiciones</a>
                  </label>
                </div>

                <!-- 6. BOTÓN DESTACADO VISIBLEMENTE -->
                <button type="submit" id="register-submit-btn" class="btn btn-primary w-100 py-2 fs-5 fw-bold shadow-sm mb-3" disabled>
                  Crear Cuenta
                </button>

              </form>
            </div>

          </div>

          <hr class="my-3">

          <div class="text-center">
            <p class="text-muted small mb-2">¿Quieres ver la tienda sin registrarte?</p>
            <a href="index.html" class="btn btn-outline-secondary w-100 btn-sm">
              <i class="bi bi-person-walking me-1"></i> Continuar como Invitado
            </a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="login-admin.html" class="text-muted small text-decoration-none">
            <i class="bi bi-shield-lock me-1"></i> Acceso exclusivo para Administradores
          </a>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
