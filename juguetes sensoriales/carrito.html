<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top" aria-label="Navegación principal">
    <div class="container">
      <a class="navbar-brand text-primary fs-3" href="index.html">
        <i class="bi bi-balloon-heart-fill text-warning me-2" aria-hidden="true"></i>SensoriToys
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button> 
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Mis Pedidos</a></li>
          <li class="nav-item"><a class="nav-link" href="reclamos.html">Reclamos y Reembolsos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="login.html" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-person-circle me-1"></i> Iniciar Sesión / Registro
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="fw-bold mb-4 h2"><i class="bi bi-cart3 me-2" aria-hidden="true"></i>Mi Carrito de Compras</h1>
    <div class="row">
      <div class="col-md-7 mb-3">
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-3">
          <h2 class="h5 fw-bold mb-3">Productos Seleccionados</h2>
          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <div>
              <h3 class="h6 mb-0 fw-bold">Mordedor Sensorial Silicona</h3>
              <small class="text-muted">$6.990 c/u</small>
            </div>
            <div class="d-flex align-items-center gap-2">
              <label for="item-qty-1" class="visually-hidden">Cantidad para Mordedor Sensorial Silicona</label>
              <input type="number" id="item-qty-1" class="form-control form-control-sm" style="width:65px;" value="2" min="1">
              <span class="fw-bold ms-2">$13.980</span>
              <button class="btn btn-sm btn-outline-danger ms-2" aria-label="Eliminar Mordedor Sensorial"><i class="bi bi-trash" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-3">
          <h2 class="h5 fw-bold mb-3">Dirección de Envío y Pago</h2>
          
          <!-- FORMULARIO DE ENVÍO Y COMPRA ESTRUCTURADO (REQUISITO 5) -->
          <form id="checkout-form" novalidate>
            
            <div class="mb-2">
              <label for="ship-street" class="form-label small fw-semibold">Calle <span class="text-danger">*</span></label>
              <input type="text" id="ship-street" class="form-control form-control-sm" placeholder="Ej: Av. Las Flores" aria-describedby="ship-street-error">
              <div id="ship-street-error" class="invalid-feedback d-none" aria-live="polite"></div>
            </div>

            <div class="row mb-2">
              <div class="col-6">
                <label for="ship-number" class="form-label small fw-semibold">Número <span class="text-danger">*</span></label>
                <input type="text" id="ship-number" class="form-control form-control-sm" placeholder="Ej: 1234" aria-describedby="ship-number-error">
                <div id="ship-number-error" class="invalid-feedback d-none" aria-live="polite"></div>
              </div>
              <div class="col-6">
                <label for="ship-housing" class="form-label small fw-semibold">Tipo Vivienda <span class="text-danger">*</span></label>
                <select id="ship-housing" class="form-select form-select-sm" aria-describedby="ship-housing-error">
                  <option value="">Seleccione...</option>
                  <option value="Casa">Casa</option>
                  <option value="Departamento">Departamento</option>
                </select>
                <div id="ship-housing-error" class="invalid-feedback d-none" aria-live="polite"></div>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-6">
                <label for="ship-city" class="form-label small fw-semibold">Ciudad <span class="text-danger">*</span></label>
                <input type="text" id="ship-city" class="form-control form-control-sm" value="Concepción" aria-describedby="ship-city-error">
                <div id="ship-city-error" class="invalid-feedback d-none" aria-live="polite"></div>
              </div>
              <div class="col-6">
                <!-- SELECT ESTANDARIZADO DE COMUNAS (REQUISITO 5) -->
                <label for="ship-comuna" class="form-label small fw-semibold">Comuna <span class="text-danger">*</span></label>
                <select id="ship-comuna" class="form-select form-select-sm" aria-describedby="ship-comuna-error">
                  <option value="">Seleccione...</option>
                  <option value="Concepción" selected>Concepción</option>
                  <option value="San Pedro de la Paz">San Pedro de la Paz</option>
                  <option value="Talcahuano">Talcahuano</option>
                  <option value="Chiguayante">Chiguayante</option>
                  <option value="Santiago">Santiago</option>
                  <option value="Providencia">Providencia</option>
                  <option value="Viña del Mar">Viña del Mar</option>
                </select>
                <div id="ship-comuna-error" class="invalid-feedback d-none" aria-live="polite"></div>
              </div>
            </div>

            <div class="mb-3">
              <label for="ship-phone" class="form-label small fw-semibold">Teléfono de Contacto <span class="text-danger">*</span></label>
              <input type="tel" id="ship-phone" class="form-control form-control-sm" value="+56912345678" placeholder="+569XXXXXXXX" aria-describedby="ship-phone-error">
              <div id="ship-phone-error" class="invalid-feedback d-none" aria-live="polite"></div>
            </div>

            <hr>
            <div class="d-flex justify-content-between mb-2"><span>Subtotal:</span><span>$13.980</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Despacho:</span><span>$3.500</span></div>
            <div class="d-flex justify-content-between mb-3 fw-bold fs-5">
              <span>Total:</span><span class="text-primary">$17.480</span>
            </div>

            <button type="submit" class="btn btn-pastel-primary w-100">Finalizar Compra</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
