<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-balloon-heart-fill me-2"></i>SensoriToys
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <h3 class="fw-bold mb-3 text-center">Registro de Usuario</h3>
          <form action="index.html" method="GET">
            <div class="mb-3">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" required placeholder="Juan Pérez">
            </div>
            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" required placeholder="ejemplo@correo.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña (Mínimo 6 caracteres)</label>
              <input type="password" class="form-control" minlength="6" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Reingresar Contraseña</label>
              <input type="password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-orange w-100 py-2">Crear Cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
