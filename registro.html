<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand text-primary fs-3" href="index.html">
        <i class="bi bi-balloon-heart-fill text-warning me-2"></i>SensoriToys
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- FORMULARIO DE REGISTRO CON VALIDACIONES HTML5 (HU-1, HU-51, HU-52, HU-53) -->
  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h3 class="fw-bold mb-3 text-center">Registro de Usuario</h3>
          <form action="index.html" method="GET">
            <div class="mb-3">
              <label class="form-label">Nombre Completo (HU-51)</label>
              <input type="text" class="form-control" required placeholder="Juan Pérez">
            </div>
            <div class="mb-3">
              <label class="form-label">Correo Electrónico (HU-51)</label>
              <input type="email" class="form-control" required placeholder="ejemplo@correo.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña (Mínimo 6 caracteres HU-52)</label>
              <input type="password" class="form-control" minlength="6" required>
            </div>
            <!-- Reingresar Contraseña HU-53 -->
            <div class="mb-3">
              <label class="form-label">Reingresar Contraseña (HU-53)</label>
              <input type="password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-pastel-primary w-100">Crear Cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
