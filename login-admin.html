<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Acceso Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/miestilo.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR CON MARCA (VISIBILIDAD Y CONSISTENCIA) -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-balloon-heart-fill me-2" style="color: var(--color-yellow);"></i>SensoriToys
      </a>
      <a href="index.html" class="btn btn-sm btn-blue-light">
        <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda
      </a>
    </div>
  </nav>

  <!-- CONTENEDOR CENTRADO DE ACCESO -->
  <main class="container py-5">
    <div class="row justify-content-center my-auto">
      <div class="col-md-6 col-lg-5">
        
        <!-- TARJETA DESTACADA SOBRE FONDO SUAVE -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          
          <div class="text-center mb-4">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-white shadow-sm" style="width: 60px; height: 60px; background-color: var(--color-red);">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: var(--color-blue-dark);">Panel de Control</h3>
            <p class="text-muted small mb-0">Ingrese sus credenciales de administrador</p>
          </div>

          <!-- CUADRO INFORMATIVO DE PRUEBA -->
          <div class="p-3 mb-4 rounded-3 border-start border-4 border-info bg-light">
            <div class="d-flex align-items-center mb-1">
              <i class="bi bi-info-circle-fill me-2" style="color: var(--color-blue-light);"></i>
              <strong class="small text-dark">Credenciales de prueba:</strong>
            </div>
            <div class="small text-muted ms-4">
              <div><strong>Usuario:</strong> admin@sensoritoys.cl</div>
              <div><strong>Clave:</strong> admin123</div>
            </div>
          </div>

          <!-- FORMULARIO DE ACCESO -->
          <form action="admin.html" method="GET">
            <div class="mb-3">
              <label class="form-label fw-semibold small text-dark">Usuario o Email Admin <span class="text-danger">*</span></label>
              <input type="email" class="form-control" required value="admin@sensoritoys.cl">
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-semibold small text-dark">Contraseña <span class="text-danger">*</span></label>
              <input type="password" class="form-control" required value="admin123">
            </div>

            <!-- BOTÓN PRINCIPAL EN ROJO (#D93232) -->
            <button type="submit" class="btn btn-danger w-100 py-3 fw-bold fs-6 mb-3" style="background-color: var(--color-red) !important; border-color: var(--color-red) !important;">
              <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Panel
            </button>
          </form>

          <div class="text-center mt-2">
            <a href="index.html" class="text-muted small text-decoration-none">
              <i class="bi bi-house me-1"></i> Ir al Inicio de la Tienda
            </a>
          </div>

        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
