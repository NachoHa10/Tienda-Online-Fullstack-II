<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Reclamos y Reembolsos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/miestilo.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-balloon-heart-fill me-2"></i>SensoriToys
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Mis Pedidos</a></li>
          <li class="nav-item"><a class="nav-link active" href="reclamos.html">Reclamos y Reembolsos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="login.html" class="btn-user-icon">
            <i class="bi bi-person-fill fs-5"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex align-items-center mb-4">
      <div class="rounded-circle p-3 text-white me-3" style="background-color: var(--color-blue-dark);">
        <i class="bi bi-chat-left-dots-fill fs-2"></i>
      </div>
      <div>
        <h2 class="fw-bold mb-0" style="color: var(--color-blue-dark);">Gestión de Reclamos y Solicitudes de Reembolso</h2>
        <p class="text-muted mb-0">Envía tus dudas o requerimientos de devolución sobre tus pedidos</p>
      </div>
    </div>

    <div class="row g-4">
      <!-- FORMULARIO RECLAMOS -->
      <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-primary"></i>Ingresar Solicitud</h5>
          <form id="claim-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">ID del Pedido *</label>
              <input type="text" class="form-control" id="claim-order-id" placeholder="Ej: #1001" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tipo de Solicitud *</label>
              <select class="form-select" id="claim-type">
                <option value="Solicitud de Reembolso">Solicitud de Reembolso</option>
                <option value="Problema con el Envió">Problema con el Envío</option>
                <option value="Producto Defectuoso">Producto Defectuoso</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Detalle o Motivo *</label>
              <textarea class="form-control" id="claim-detail" rows="3" placeholder="Explique detalladamente..." required></textarea>
            </div>
            <button type="submit" class="btn btn-orange w-100 py-2 fw-bold">
              <i class="bi bi-send me-2"></i>Enviar Solicitud
            </button>
          </form>
        </div>
      </div>

      <!-- HISTORIAL DINÁMICO DE RECLAMOS -->
      <div class="col-md-7">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
          <h5 class="fw-bold mb-3"><i class="bi bi-journal-text me-2 text-primary"></i>Historial de Reclamos</h5>
          <div id="user-claims-list">
            <!-- Se inyecta dinámicamente con JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
