<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Reclamos y Reembolsos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN ACTUALIZADA -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand text-primary fs-3" href="index.html">
        <i class="bi bi-balloon-heart-fill text-warning me-2"></i>SensoriToys
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button> 
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="pedidos.html">Mis Pedidos</a></li>
          <li class="nav-item"><a class="nav-link active" href="reclamos.html">Reclamos y Reembolsos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <div class="input-group input-group-sm">
            <input type="text" class="form-control" placeholder="Buscar juguete...">
            <button class="btn btn-outline-secondary" type="button"><i class="bi bi-search"></i></button>
          </div>
          <a href="carrito.html" class="btn btn-pastel-primary position-relative">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
          </a>
          <a href="login.html" class="btn-user-icon" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Iniciar Sesión / Registro" aria-label="Iniciar Sesión o Registro">
            <i class="bi bi-person-fill fs-5"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="container py-4">
    <h2 class="fw-bold mb-4"><i class="bi bi-chat-left-dots me-2"></i>Gestión de Quejas y Solicitudes de Reembolso (EP-13 / HU-47)</h2>
    <div class="row">
      <div class="col-md-5 mb-3">
        <div class="card border-0 shadow-sm rounded-4 p-3">
          <h5 class="fw-bold mb-3">Ingresar Solicitud</h5>
          <form action="reclamos.html" method="GET">
            <div class="mb-3">
              <label class="form-label">ID del Pedido</label>
              <input type="number" class="form-control" required min="1" value="101">
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo de Solicitud</label>
              <select class="form-select">
                <option value="reembolso">Solicitud de Reembolso</option>
                <option value="queja">Queja por producto/despacho</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Detalle o Motivo</label>
              <textarea class="form-control" rows="3" required placeholder="Explique el motivo..."></textarea>
            </div>
            <button type="submit" class="btn btn-pastel-primary w-100">Enviar Solicitud</button>
          </form>
        </div>
      </div>

      <div class="col-md-7">
        <div class="card border-0 shadow-sm rounded-4 p-3">
          <h5 class="fw-bold mb-3">Historial de Mis Reclamos</h5>
          <div class="border-bottom pb-2 mb-2">
            <strong>Ticket #501 (Pedido #101)</strong> - <span class="badge bg-warning text-dark">En Revisión</span>
            <p class="mb-0 text-muted small">Solicitud de Reembolso: Empaque llegó abierto durante el despacho.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
