<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Iniciar Sesión o Registrarse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/miestilo.css">
</head>
<body class="bg-light">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- LOGO Y TÍTULO -->
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h1 class="display-5 fw-bold" style="color: var(--color-blue-dark);">
              <i class="bi bi-balloon-heart-fill me-2" style="color: var(--color-yellow);"></i>SensoriToys
            </h1>
          </a>
          <p class="text-muted">Juguetes Sensoriales para el Desarrollo y Calma</p>
        </div>

        <!-- TARJETA DE LOGIN / REGISTRO -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          
          <!-- PESTAÑAS (TABS) -->
          <ul class="nav nav-pills nav-fill mb-4 custom-tabs" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active rounded-start-pill" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Ingresar</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link rounded-end-pill" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Registrarse</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">
            
            <!-- PANEL: INICIAR SESIÓN -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
              <form id="login-form">
                <div class="mb-3">
                  <label for="login-email" class="form-label fw-semibold">Correo Electrónico</label>
                  <input type="email" class="form-control" id="login-email" placeholder="correo@ejemplo.com" required>
                  <div class="invalid-feedback error-msg d-none"></div>
                </div>
                
                <div class="mb-4">
                  <label for="login-pass" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" class="form-control" id="login-pass" placeholder="••••••••" required>
                  <div class="invalid-feedback error-msg d-none"></div>
                </div>

                <button type="submit" class="btn btn-orange w-100 py-2 mb-3 fw-bold fs-6">
                  Iniciar Sesión
                </button>
              </form>

              <hr class="text-muted my-4">
              
              <div class="text-center">
                <p class="text-muted small mb-2">¿Quieres explorar la tienda primero?</p>
                <a href="index.html" class="btn btn-blue-light w-100 py-2">
                  <i class="bi bi-shop me-2"></i>Continuar como Invitado
                </a>
              </div>
            </div>

            <!-- PANEL: REGISTRARSE -->
            <div class="tab-pane fade" id="register-pane" role="tabpanel">
              <form id="register-form">
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="reg-firstname" class="form-label small fw-semibold">Nombres <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" id="reg-firstname" required>
                  </div>
                  <div class="col-6">
                    <label for="reg-lastname1" class="form-label small fw-semibold">Apellido <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" id="reg-lastname1" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="reg-rut" class="form-label small fw-semibold">RUT <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-sm" id="reg-rut" placeholder="12.345.678-9" required>
                  <div class="invalid-feedback error-msg d-none"></div>
                </div>

                <div class="mb-3">
                  <label for="reg-email" class="form-label small fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                  <input type="email" class="form-control form-control-sm" id="reg-email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="reg-pass" class="form-label small fw-semibold">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control form-control-sm" id="reg-pass" required>
                  </div>
                  <div class="col-6">
                    <label for="reg-pass-confirm" class="form-label small fw-semibold">Confirmar <span class="text-danger">*</span></label>
                    <input type="password" class="form-control form-control-sm" id="reg-pass-confirm" required>
                  </div>
                </div>

                <div class="form-check mb-4 mt-2">
                  <input class="form-check-input" type="checkbox" id="terms-checkbox">
                  <label class="form-check-label small text-muted" for="terms-checkbox">
                    He leído y acepto los <a href="#" class="text-decoration-none">Términos y Condiciones</a>
                  </label>
                </div>

                <button type="submit" class="btn btn-blue-dark w-100 py-2 fw-bold" id="register-submit-btn" disabled>
                  Crear Cuenta
                </button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
