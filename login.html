<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SensoriToys - Acceso Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/miestilo.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        
        <!-- ENCABEZADO DE MARCA CON LOGO Y COLORES OFICIALES -->
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h1 class="display-4 fw-bold mb-1">
              <i class="bi bi-balloon-heart-fill me-2" style="color: var(--color-yellow);"></i>SensoriToys
            </h1>
          </a>
          <p class="text-muted fw-semibold">Juguetes Sensoriales para el Desarrollo y Calma</p>
        </div>

        <!-- TARJETA DESTACADA SOBRE FONDO GRIS/AZUL SUAVE -->
        <div class="card card-form p-4 p-md-5">
          
          <!-- PESTAÑAS CON ALTO CONTRASATE (USABILIDAD NIELSEN #1 Y #4) -->
          <ul class="nav nav-pills nav-justified mb-4 gap-2" id="pills-tab" role="tablist">
            <li class="nav-item">
              <button class="nav-link" id="login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">Ingresar</button>
            </li>
            <li class="nav-item">
              <button class="nav-link active" id="register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">Registrarse</button>
            </li>
          </ul>

          <div class="tab-content" id="pills-tabContent">
            
            <!-- FORMULARIO DE LOGIN -->
            <div class="tab-pane fade" id="pills-login">
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-email" class="form-label fw-semibold">Correo Electrónico</label>
                  <input type="email" id="login-email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="mb-3">
                  <label for="login-pass" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-orange w-100 py-2 fs-6 mb-3">Iniciar Sesión</button>
              </form>
            </div>

            <!-- FORMULARIO DE REGISTRO CON CAMPOS CLAROS Y BOTÓN DE ACCIÓN NARANJA -->
            <div class="tab-pane fade show active" id="pills-register">
              <form id="register-form" novalidate>
                
                <div class="mb-3">
                  <label for="reg-firstname" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                  <input type="text" id="reg-firstname" class="form-control" placeholder="Ej: Juan" required>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <label for="reg-lastname1" class="form-label fw-semibold">Primer Apellido <span class="text-danger">*</span></label>
                    <input type="text" id="reg-lastname1" class="form-control" placeholder="Ej: Pérez" required>
                  </div>
                  <div class="col-md-6">
                    <label for="reg-lastname2" class="form-label fw-semibold">Segundo Apellido</label>
                    <input type="text" id="reg-lastname2" class="form-control" placeholder="Ej: González">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="reg-rut" class="form-label fw-semibold">RUT <span class="text-danger">*</span></label>
                  <input type="text" id="reg-rut" class="form-control" placeholder="Ej: 12.345.678-9" required>
                </div>

                <div class="mb-3">
                  <label for="reg-email" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                  <input type="email" id="reg-email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <label for="reg-pass" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="reg-pass" class="form-control" placeholder="••••••••" required>
                  </div>
                  <div class="col-md-6">
                    <label for="reg-pass-confirm" class="form-label fw-semibold">Reingresar Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="reg-pass-confirm" class="form-control" placeholder="••••••••" required>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="terms-checkbox">
                  <label class="form-check-label small" for="terms-checkbox">
                    Estoy de acuerdo con los <a href="#" class="text-decoration-underline" style="color: var(--color-blue-dark);">términos y condiciones</a>
                  </label>
                </div>

                <!-- BOTÓN PRINCIPAL ACCIÓN LLAMATIVA NARANJA (#F2845C) -->
                <button type="submit" id="register-submit-btn" class="btn btn-orange w-100 py-3 fs-5 fw-bold mb-2">
                  Crear Cuenta
                </button>
              </form>
            </div>

          </div>

          <hr class="my-4">

          <div class="text-center">
            <p class="text-muted small mb-2">¿Quieres explorar la tienda primero?</p>
            <a href="index.html" class="btn btn-blue-light w-100 py-2">
              <i class="bi bi-shop me-1"></i> Continuar como Invitado
            </a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="login-admin.html" class="text-muted small text-decoration-none">
            <i class="bi bi-shield-lock me-1"></i> Acceso exclusivo para Administradores
          </a>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
